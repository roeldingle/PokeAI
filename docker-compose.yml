# =============================================================================
# docker-compose.yml — Full-Stack PokeAI Arena Orchestration
# Lesson 11: Production Evals, Guardrails, Docker & CI/CD Pipeline
# =============================================================================

services:
  pokeai-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pokeai-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - GAME_TITLE=PokeAI
      - GAME_GUIDE=Shaneil
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
    volumes:
      - pokeai_chroma_data:/app/data/chroma
    restart: unless-stopped

  pokeai-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pokeai-frontend
    ports:
      - "5173:80"
    depends_on:
      - pokeai-backend
    restart: unless-stopped

volumes:
  pokeai_chroma_data:
