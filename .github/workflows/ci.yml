# =============================================================================
# .github/workflows/ci.yml — Automated AI Evals, Pytest & Frontend Build Gate
# Lesson 11: Production Evals, Guardrails, Docker & CI/CD Pipeline
# =============================================================================

name: PokeAI Arena CI & AI Evals Gate

on:
  push:
    branches:
      - main
      - "lesson-*-solution"
  pull_request:
    branches:
      - main

jobs:
  backend-tests-and-evals:
    name: Backend Pytest & 20-Scenario AI Eval Gate (>=85% SLA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout PokeAI Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Golden 20-Scenario AI Evaluation Suite
        env:
          PYTHONPATH: .
        run: pytest tests/evals/test_agent_evals.py -v

      - name: Run Full Backend Regression Suite
        env:
          PYTHONPATH: .
        run: pytest tests -v

  frontend-typecheck-and-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout PokeAI Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify TypeScript & Vite Production Bundle
        run: npm run build
